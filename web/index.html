<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<title>GangCity</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<script>
// Ако играта гръмне при зареждане, показваме грешката вместо черен екран
window.addEventListener('error', function (e) {
  try {
    var c = document.getElementById('game'); var x = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight;
    x.fillStyle = '#300'; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = '#fff'; x.font = '14px monospace';
    var lines = ['GangCity: грешка при зареждане', String(e.message), (e.filename || '') + ':' + e.lineno + ':' + e.colno, '', 'Снимай този екран и го прати.'];
    lines.forEach(function (l, i) { x.fillText(l, 12, 30 + i * 22); });
  } catch (err) {}
});
</script>
<script src="lang.js?v=202609011651"></script>
<script src="lang3.js?v=202609011651"></script>
<script src="lang2.js?v=202609011651"></script>
<script src="game.js?v=202609011651"></script>
</body>
</html>
